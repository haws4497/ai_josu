<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>매출 달력 | AI 사장님 비서</title><link rel="stylesheet" href="/auth.css"></head><body><header class="auth-topbar"><a class="brand" href="/"><span class="brand-mark">✦</span><span>AI 사장님 비서</span></a></header><main class="auth-shell sales-page"><p class="eyebrow">DAILY SALES</p><h1>매출 달력</h1><p class="intro">날짜별 매출을 기록하고 월별 합계를 확인하세요.</p><p id="salesMessage" class="form-message" role="alert" aria-live="polite"></p><section class="sales-summary"><span>이번 달 매출</span><strong id="monthTotal">0원</strong></section><form id="salesForm"><label class="field"><span class="field-label">매출 날짜 <span class="required">*</span></span><input id="saleDate" name="saleDate" type="date" required></label><label class="field"><span class="field-label">하루 매출 <span class="required">*</span></span><span class="amount-input"><input id="saleAmount" name="amount" type="number" min="0" step="1" inputmode="numeric" required placeholder="예: 350000"><span>원</span></span></label><label class="field"><span class="field-label">메모 <span class="optional">(선택)</span></span><input name="notes" maxlength="500" placeholder="예: 주말 행사 매출"></label><button class="primary-btn" type="submit">매출 저장</button></form><section class="calendar-section"><div class="calendar-head"><button id="prevMonth" class="month-btn" type="button" aria-label="이전 달">‹</button><h2 id="monthLabel"></h2><button id="nextMonth" class="month-btn" type="button" aria-label="다음 달">›</button></div><div class="calendar-weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendarGrid" class="calendar-grid" aria-live="polite"></div></section><a class="secondary-btn schedule-home" href="/">메인으로 이동</a></main><script src="/schedule.js"></script><script src="/sales.js"></script></body></html>
