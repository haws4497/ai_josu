<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 | AI 사장님 비서</title><link rel="stylesheet" href="/auth.css"></head><body><header class="auth-topbar"><a class="brand" href="/"><span class="brand-mark">✦</span><span>AI 사장님 비서</span></a></header><main class="auth-shell"><p class="eyebrow">CREATE ACCOUNT</p><h1>회원가입</h1><p class="intro">필수 항목을 입력해 계정을 만들어주세요.</p><p id="formMessage" class="form-message" role="alert" aria-live="polite"></p><form id="registerForm" novalidate><label class="field"><span class="field-label">이메일 <span class="required">*</span></span><input name="email" type="email" autocomplete="email" required placeholder="name@example.com"></label><label class="field"><span class="field-label">비밀번호 <span class="required">*</span></span><span class="password-wrap"><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="8자 이상 입력하세요"><button class="toggle-password" type="button" data-target="password" aria-label="비밀번호 보기">보기</button></span><p class="helper">8자 이상, 최대 128자</p></label><label class="field"><span class="field-label">비밀번호 확인 <span class="required">*</span></span><span class="password-wrap"><input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required placeholder="비밀번호를 다시 입력하세요"><button class="toggle-password" type="button" data-target="passwordConfirm" aria-label="비밀번호 확인 보기">보기</button></span></label><label class="field"><span class="field-label">닉네임 <span class="required">*</span></span><input name="nickname" required minlength="2" maxlength="30" autocomplete="nickname" placeholder="2~30자로 입력하세요"></label><label class="field"><span class="field-label">이름 <span class="required">*</span></span><input name="name" required maxlength="50" autocomplete="name" placeholder="이름을 입력하세요"></label><button class="primary-btn" type="submit" data-default-text="회원가입">회원가입</button></form><nav class="form-links" aria-label="계정 메뉴"><a href="/login">이미 계정이 있으신가요? 로그인</a></nav></main><script src="/auth.js"></script></body></html>
