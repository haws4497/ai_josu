<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 | AI 사장님 비서</title><link rel="stylesheet" href="/auth.css"></head><body><header class="auth-topbar"><a class="brand" href="/"><span class="brand-mark">✦</span><span>AI 사장님 비서</span></a></header><main class="auth-shell"><p class="eyebrow">WELCOME BACK</p><h1>로그인</h1><p class="intro">사업장을 위한 AI 비서를 계속 이용해보세요.</p><p id="formMessage" class="form-message" role="alert" aria-live="polite"></p><form id="loginForm" novalidate><label class="field"><span class="field-label">이메일 <span class="required">*</span></span><input name="email" type="email" autocomplete="email" required placeholder="name@example.com"></label><label class="field"><span class="field-label">비밀번호 <span class="required">*</span></span><span class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="비밀번호를 입력하세요"><button class="toggle-password" type="button" data-target="password" aria-label="비밀번호 보기">보기</button></span></label><button class="primary-btn" type="submit" data-default-text="로그인">로그인</button></form><nav class="form-links" aria-label="계정 메뉴"><a href="/register">회원가입</a><a href="/forgot-password">비밀번호를 잊으셨나요?</a></nav></main><script src="/auth.js"></script></body></html>
