<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일정표 | AI 사장님 비서</title><link rel="stylesheet" href="/auth.css"></head><body><header class="auth-topbar"><a class="brand" href="/"><span class="brand-mark">✦</span><span>AI 사장님 비서</span></a></header><main class="auth-shell schedule-page"><p class="eyebrow">MY SCHEDULE</p><h1>일정표</h1><p class="intro">AI 비서에게 말한 일정을 확인하고 관리하세요.</p><p id="scheduleMessage" class="form-message" role="alert" aria-live="polite"></p><form id="scheduleForm"><label class="field"><span class="field-label">일정 제목 <span class="required">*</span></span><input name="title" maxlength="120" required placeholder="예: 거래처 미팅"></label><label class="field"><span class="field-label">날짜와 시간 <span class="required">*</span></span><input name="startsAt" type="datetime-local" required></label><label class="field"><span class="field-label">메모 <span class="optional">(선택)</span></span><input name="notes" maxlength="1000" placeholder="장소나 준비할 내용을 적어주세요"></label><button class="primary-btn" type="submit">일정 추가</button></form><section class="schedule-list-section"><h2>다가오는 일정</h2><div id="scheduleList" class="schedule-list" aria-live="polite"></div></section><a class="secondary-btn schedule-home" href="/">메인으로 이동</a></main><script src="/schedule.js"></script></body></html>
